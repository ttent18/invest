<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>今日やること</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <!-- iOSはアイコンにこれを見る（manifestのicons配列は見ない）。 -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- これが無いと、ホーム画面に追加してもSafariのタブとして開いてしまい、
         window.navigator.standalone が常にfalseのままになる（＝下の案内が
         永久に消えず、通知の許可も一生求められない）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="投資" />
  </head>
  <body>
    <noscript>
      この画面を使うにはJavaScriptが必要です。iPhoneの「設定」からJavaScriptを有効にしてください。
    </noscript>

    <div class="app-container">
      <div id="nav-root"></div>
      <div id="install-banner-root"></div>
      <h1>今日やること</h1>
      <div id="banner-root"></div>
      <main id="main-root">
        <div class="loading-state">読み込んでいます…</div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module">
      import {
        loadState,
        postFill,
        postSkip,
        postAnalyze,
        postSubscribe,
        urlBase64ToUint8Array,
        yen,
        pct,
        whenText,
        toDatetimeLocalValue,
        jstLocalToIso,
        escapeHtml,
        banner,
        renderNav,
        renderUnappliedBanner,
        clientKeyFor,
        forgetClientKey,
        isJapaneseStock,
        indexUnappliedFills,
        recordedFillForProposal,
        failedFillForProposal,
      } from "/app.js";

      // ---------------------------------------------------------------
      // ホーム画面への追加 / 通知
      //
      // iPhoneでは、ホーム画面に追加したアイコンから開いた場合だけ通知が
      // 届く。Safariのタブとして開いているだけでは、
      // Notification.requestPermission() すら呼べない（Appleの仕様で、
      // 回避する方法が無い）。だからまず「ホーム画面に追加されているか」を
      // 判定し、されていなければ通知の話に進めず、追加の手順だけを見せる。
      // ---------------------------------------------------------------

      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches;

      // タブで開いている間ずっと見える、常設の案内（refreshで消えない
      // banner-root とは別のrootに出す）。
      function renderInstallBanner() {
        const root = document.getElementById("install-banner-root");
        root.innerHTML = "";
        if (isStandalone) return;
        root.appendChild(
          banner(
            "info",
            "通知を受け取るには、ホーム画面への追加が必要です。\n" +
              "下の共有ボタン（□に↑）→「ホーム画面に追加」→ そのアイコンから開いてください。"
          )
        );
      }

      // Service Workerの登録（通知を受け取るための下準備）。
      // 登録に失敗しても、この画面自体（提案の確認・記録）は普通に使える
      // ままにする。通知は補助であって本体ではないため、ここで投げ直して
      // 画面の読み込み自体を止めることはしない。
      function registerServiceWorker() {
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.register("/sw.js").catch((err) => {
          console.error("通知を受け取る準備に失敗しました", err);
        });
      }

      // 「通知を受け取る」の押下。必ずボタンを押されたことをきっかけに
      // Notification.requestPermission() を呼ぶこと（自動で呼ぶとiPhoneでは
      // 拒否されて、以後二度と許可を求められなくなる）。
      async function subscribeToNotifications(button, vapidPublicKey) {
        const original = button.textContent;
        button.disabled = true;

        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          showTransientMessage("この端末では通知を使えません", "info");
          button.disabled = false;
          return;
        }

        let permission;
        try {
          permission = await Notification.requestPermission();
        } catch (err) {
          console.error("通知の許可を確認できませんでした", err);
          showTransientMessage("通知の許可を確認できませんでした", "info");
          button.disabled = false;
          return;
        }

        if (permission !== "granted") {
          // 拒否はエラーとして扱わない。通知は補助であって本体ではない。
          showTransientMessage(
            "通知は受け取らない設定になっています。iPhoneの設定から変えられます",
            "info"
          );
          button.disabled = false;
          return;
        }

        try {
          const registration = await navigator.serviceWorker.ready;
          const subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
          });
          const result = await postSubscribe(subscription.toJSON());
          if (!result.ok) {
            showTransientMessage(result.message, "danger");
            button.disabled = false;
            button.textContent = original;
            return;
          }
          button.textContent = "通知を受け取ります";
          button.disabled = true;
        } catch (err) {
          console.error("通知の登録に失敗しました", err);
          showTransientMessage("通知の登録に失敗しました。もう一度お試しください", "danger");
          button.disabled = false;
          button.textContent = original;
        }
      }

      // ホーム画面に追加されている（isStandalone）ときだけ出すカード。
      // vapidPublicKey が無い（/api/stateがnullを返した＝サーバー側の
      // 設定がまだ済んでいない）ときは、ボタンを押せない状態で理由だけ出す。
      function renderNotifyCard(root, vapidPublicKey) {
        if (!isStandalone) return;

        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h2");
        h.textContent = "通知";
        card.appendChild(h);

        const note = document.createElement("p");
        note.className = "hint-text";
        const btn = document.createElement("button");
        btn.className = "btn btn-block";

        if (!vapidPublicKey) {
          note.textContent = "通知の設定がまだ済んでいません。";
          btn.classList.add("btn-secondary");
          btn.textContent = "通知を受け取る";
          btn.disabled = true;
        } else {
          note.textContent = "損切りが必要なときや、新しい提案ができたときにお知らせします。";
          btn.classList.add("btn-primary");
          btn.textContent = "通知を受け取る";
          btn.addEventListener("click", () => subscribeToNotifications(btn, vapidPublicKey));
        }

        card.appendChild(note);
        card.appendChild(btn);
        root.appendChild(card);
      }

      // ---------------------------------------------------------------
      // 帯（一時的なお知らせ）
      // ---------------------------------------------------------------

      // banner-root は state を読み直すたびに中身を作り直す（refresh で
      // 消える）。一時的なお知らせ（記録しました、など）は別の
      // toast-root に出す。ここは refresh で消さないので、
      // 出したメッセージが refresh の巻き添えで一瞬で消えることが無い。
      function showTransientMessage(text, kind) {
        const root = document.getElementById("toast-root");
        const el = banner(kind || "info", text);
        el.style.position = "fixed";
        el.style.left = "16px";
        el.style.right = "16px";
        el.style.bottom = "calc(16px + env(safe-area-inset-bottom))";
        el.style.zIndex = "100";
        root.appendChild(el);
        setTimeout(() => {
          el.remove();
        }, 4500);
      }

      // 勝手に消えないお知らせ。**次にやることが残っているとき**に使う。
      // 4.5秒で消える showTransientMessage では、「SBIの予約注文を置き
      // 直してください」のような、読んで動く必要のある案内が読み終わる前に
      // 消えてしまう。閉じるのは利用者に決めさせる。
      //
      // lines: 段落にする文字列の配列。
      // link: { href, label } を渡すと、末尾にその画面へのリンクを出す。
      function showStickyMessage(lines, kind, link) {
        const root = document.getElementById("toast-root");
        root.innerHTML = "";
        const el = document.createElement("div");
        el.className = `banner banner-${kind === "danger" ? "danger" : "info"}`;
        el.style.position = "fixed";
        el.style.left = "16px";
        el.style.right = "16px";
        el.style.bottom = "calc(16px + env(safe-area-inset-bottom))";
        el.style.zIndex = "100";
        el.style.maxHeight = "70vh";
        el.style.overflowY = "auto";

        for (const line of lines) {
          const p = document.createElement("p");
          p.textContent = line;
          el.appendChild(p);
        }

        if (link) {
          const a = document.createElement("a");
          a.href = link.href;
          a.textContent = link.label;
          a.className = "sticky-link";
          el.appendChild(a);
        }

        const close = document.createElement("button");
        close.className = "btn btn-secondary btn-block";
        close.textContent = "閉じる";
        close.addEventListener("click", () => el.remove());
        el.appendChild(close);

        root.appendChild(el);
      }

      // ---------------------------------------------------------------
      // モーダルの開閉
      // ---------------------------------------------------------------

      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
      }

      // 「買った」「売った」の入力欄。
      //
      // proposal.action が "sell" のときは「売った」の入力欄になる。
      // 損切りの予約注文の確認チェックは、新しく買うとき（safety net を
      // 新しく仕掛けるとき）だけ必要なので、買いのときだけ出す。
      function openFillModal(proposal) {
        document.getElementById("modal-root").innerHTML = "";
        const isBuy = proposal.action === "buy";
        const now = new Date();
        // 二重送信よけの鍵。**この提案に対する鍵は sessionStorage に
        // 退避してあり、モーダルを閉じて開き直しても同じ鍵になる**
        // （app.js の clientKeyFor を参照）。閉じるたびに新しい鍵に
        // なると、「サーバーには届いたが応答が返らなかった」場合に
        // 同じ売買が2行記録される。記録できたら forgetClientKey で捨てる。
        const keyScope = `proposal:${proposal.id}:${proposal.action}`;
        let clientKey = clientKeyFor(keyScope);

        // 会社名。取れていない銘柄では出さないだけにする（この1件のせいで
        // 入力欄そのものが出せなくなってはいけない）。
        const nameText = typeof proposal.name === "string" && proposal.name.trim() !== "" ? proposal.name : null;

        // 100株単位は日本株（銘柄コードが .T で終わるもの）だけの決まり。
        // サーバー側の functions/_shared/validate.js も日本株にだけ
        // この確認をしている。米国株にまで「100株単位」と案内すると嘘になる。
        // **保有画面の [売った]（holdings.html）と同じ案内にすること。**
        // 同じ「売る」で言うことが食い違うと、どちらが本当か分からなくなる。
        const isJp = isJapaneseStock(proposal.symbol);
        const unit = isJp ? 100 : 1;
        const unitHint = isJp
          ? "100株単位で入れてください（日本株は100株ずつしか売買できません）。"
          : "1株から売れます（この銘柄は日本株ではないので、100株単位の決まりはありません）。";

        // 提案の買値。これと違う値段で買うと、システムが持つ損切りの値段が
        // 実際に買った値段から計算し直され、SBIに置いた予約注文とずれる。
        const proposedPrice =
          isBuy && typeof proposal.entry_price === "number" && Number.isFinite(proposal.entry_price)
            ? proposal.entry_price
            : null;

        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal-sheet">
            <div class="modal-title">${isBuy ? "買った" : "売った"}を記録する</div>
            <div class="modal-subtitle">${escapeHtml(proposal.symbol)} ・ ${escapeHtml(proposal.bucket)}枠</div>

            <div class="form-row">
              <label>銘柄コード</label>
              <div class="form-row-static">${escapeHtml(proposal.symbol)}</div>
              ${nameText ? `<p class="hint-text">${escapeHtml(nameText)}</p>` : ""}
            </div>
            <div class="form-row">
              <label>枠</label>
              <div class="form-row-static">${escapeHtml(proposal.bucket)}枠</div>
            </div>
            <div class="form-row">
              <label>株数</label>
              <input type="number" inputmode="numeric" id="fm-quantity"
                min="${isBuy ? 1 : unit}" step="${isBuy ? 1 : unit}"
                value="${proposal.quantity ?? ""}">
              ${isBuy ? "" : `<p class="hint-text">${unitHint}</p>`}
            </div>
            ${
              isBuy
                ? ""
                : `<div class="warn-box" id="fm-partial-warn" hidden>
              提案の株数より少なく売ると、SBIに置いた予約注文の株数が実際の保有と合わなくなります。<br>
              売ったあとに予約注文を置き直してください。
            </div>`
            }
            <div class="form-row">
              <label>${isBuy ? "買った値段（1株あたり）" : "売った値段（1株あたり）"}</label>
              <input type="number" inputmode="decimal" id="fm-price" min="0" step="0.01"
                placeholder="${isBuy ? "" : "例：950"}"
                value="${isBuy && proposal.entry_price != null ? proposal.entry_price : ""}">
              <p class="hint-text">${
                isBuy
                  ? "SBIで実際に約定した値段をそのまま入れてください。提案の値段と違ってもかまいませんが、その場合はSBIに置いた予約注文も置き直す必要があります（下に案内が出ます）。"
                  : "SBIで実際に約定した値段をそのまま入れてください（提案の値段とずれていて構いません）。"
              }</p>
              ${
                // 売りの take_profit / stop_loss は、保有していたときの値の
                // 転記（migrations/001_initial.sql）。「目安」とだけ書くと
                // これから出す注文の値段に見えるので、過去に決めた値だと
                // はっきり書く。
                !isBuy
                  ? `<p class="hint-text">参考：買ったときに決めていた値段（利確 ${yen(
                      proposal.take_profit
                    )} ／ 損切り ${yen(
                      proposal.stop_loss
                    )}）。いま出す注文の値段ではありません。</p>`
                  : ""
              }
            </div>
            ${
              // 【この画面でいちばん危ないところ】
              // 提案と違う値段で買うと、システムは実際に買った値段から
              // 損切りの値段を計算し直す（src/investment/fills.py の
              // _exits）。ところがSBIに置いた予約注文は、提案のカードを
              // 見て置いた値段のまま誰も直さない。放っておくと、
              // 値下がりしたときの損がルールで決めた幅より大きくなる。
              //
              // **画面では損切りの値段を計算し直さない。**（同じ式が
              // Python・API・画面の三重管理になり、片方だけ直したときに
              // 気づけなくなる。）代わりに「ずれたこと」と「次に何を
              // すればよいか」だけを伝える。
              isBuy
                ? `<div class="warn-box" id="fm-price-warn" hidden>
              <strong>提案の値段（${yen(proposedPrice)}）と違います。</strong><br>
              このまま記録すると、損切りの値段は提案のカードの ${yen(
                proposal.stop_loss
              )} ではなく、いま入れた値段をもとに計算し直されます。
              SBIに置いた予約注文は ${yen(
                proposal.stop_loss
              )} のままなので、置き直さないとルールで決めた損切りとずれたままになります
              （提案より高く買っているほど、実際の損は決めた幅より大きくなります）。<br>
              <strong>記録したあと、この記録が反映されたら「保有」の画面を開き、そこに出ている損切りの値段を見て、SBIの予約注文をその値段に置き直してください。</strong>
            </div>`
                : ""
            }
            <div class="form-row">
              <label>売買した日時（日本時間）</label>
              <input type="datetime-local" id="fm-traded-at" value="${toDatetimeLocalValue(now)}">
            </div>
            <div class="form-row">
              <label>手数料（円）</label>
              <input type="number" inputmode="numeric" id="fm-fee" min="0" step="1" value="0">
            </div>

            ${
              isBuy
                ? `
            <div class="confirm-row">
              <input type="checkbox" id="fm-confirm">
              <label for="fm-confirm">SBIで損切りの予約注文（<strong>${yen(
                proposal.stop_loss
              )}</strong> まで値下がりしたら自動で売る注文。SBIでは「逆指値」と呼びます）を、もう入れましたか。<br>
                <strong>これを入れ忘れると、値下がりしたときに自動で損を止める仕組みが働きません。</strong></label>
            </div>`
                : ""
            }

            <div class="error-text" id="fm-error" hidden></div>

            <div class="modal-actions">
              <button class="btn btn-secondary" id="fm-cancel" type="button">やめる</button>
              <button class="btn ${isBuy ? "btn-primary" : "btn-sell"}" id="fm-submit" type="button">
                この内容で記録する
              </button>
            </div>
          </div>
        `;
        document.getElementById("modal-root").appendChild(overlay);

        const submitBtn = overlay.querySelector("#fm-submit");
        const cancelBtn = overlay.querySelector("#fm-cancel");
        const errorEl = overlay.querySelector("#fm-error");
        const checkbox = overlay.querySelector("#fm-confirm");
        const quantityInput = overlay.querySelector("#fm-quantity");
        const priceInput = overlay.querySelector("#fm-price");
        const priceWarn = overlay.querySelector("#fm-price-warn");
        const partialWarn = overlay.querySelector("#fm-partial-warn");

        // 提案の値段と違う値段を入れている間だけ、警告を出す
        // （入れ直して提案と同じ値段に戻したら消える）。
        const priceDiffers = () => {
          if (proposedPrice === null) return false;
          const raw = priceInput.value;
          if (raw === "") return false;
          const value = Number(raw);
          if (!Number.isFinite(value)) return false;
          return Math.abs(value - proposedPrice) > 1e-9;
        };
        const updatePriceWarn = () => {
          if (!priceWarn) return;
          priceWarn.hidden = !priceDiffers();
        };
        if (priceWarn) {
          priceInput.addEventListener("input", updatePriceWarn);
          updatePriceWarn();
        }

        // 売りのとき、提案より少ない株数を入れている間だけ出す警告。
        // （保有画面の [売った] と同じ案内。）
        if (partialWarn) {
          const fullQuantity = Number(proposal.quantity);
          const updatePartialWarn = () => {
            const q = Number(quantityInput.value);
            partialWarn.hidden = !(
              Number.isFinite(q) &&
              q > 0 &&
              Number.isFinite(fullQuantity) &&
              q < fullQuantity
            );
          };
          quantityInput.addEventListener("input", updatePartialWarn);
          updatePartialWarn();
        }

        if (isBuy) {
          // 確認チェックを入れるまで、確定ボタンを押せないようにする。
          // これを飛ばせるようにしないこと（安全装置の入れ忘れ防止のため）。
          submitBtn.disabled = true;
          checkbox.addEventListener("change", () => {
            submitBtn.disabled = !checkbox.checked;
          });
        }

        cancelBtn.addEventListener("click", closeModal);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) closeModal();
        });

        submitBtn.addEventListener("click", async () => {
          errorEl.hidden = true;
          // 押した瞬間に無効化し、応答が返るまで戻さない（連打での二重送信対策）。
          submitBtn.disabled = true;
          cancelBtn.disabled = true;

          const quantity = Number(quantityInput.value);
          const price = Number(priceInput.value);
          const feeRaw = overlay.querySelector("#fm-fee").value;
          const fee = feeRaw === "" ? 0 : Number(feeRaw);
          // 入力欄は日本時間で見せている（app.js の toDatetimeLocalValue）
          // ので、読み戻しも日本時間として読む。new Date(raw) は端末の
          // ローカル時刻として解釈してしまうので使わない。
          const tradedAtIso = jstLocalToIso(overlay.querySelector("#fm-traded-at").value);
          const wasPriceDifferent = isBuy && priceDiffers();

          const result = await postFill({
            client_key: clientKey || undefined,
            proposal_id: proposal.id,
            symbol: proposal.symbol,
            side: isBuy ? "buy" : "sell",
            quantity,
            price,
            fee,
            traded_at: tradedAtIso,
          });
          // 失敗しても、次の送信で同じ鍵を使えるように覚えておく。
          clientKey = result.client_key;

          if (!result.ok) {
            errorEl.textContent = result.message;
            errorEl.hidden = false;
            submitBtn.disabled = isBuy ? !checkbox.checked : false;
            cancelBtn.disabled = false;
            return;
          }

          // 記録できたので、この売買の鍵は捨てる（次に同じ提案・同じ
          // 銘柄を売買したときに使い回さないため）。
          forgetClientKey(keyScope);

          closeModal();
          // 提案と違う値段で買ったときは、**まだ利用者にやることが残って
          // いる**（SBIの予約注文の置き直し）。4.5秒で消えるお知らせでは
          // 読み終わる前に消えるので、閉じるまで残るお知らせにする。
          if (wasPriceDifferent) {
            showStickyMessage(
              [
                `${result.created ? "記録しました" : "この売買は記録済みです"}。提案の値段（${yen(
                  proposedPrice
                )}）と違う ${yen(price)} で買ったので、損切りの値段は買った値段をもとに計算し直されます。`,
                `SBIに置いた予約注文は、提案のカードに出ていた ${yen(
                  proposal.stop_loss
                )} のままです。このままだと、ルールで決めた損切りとずれた注文が置きっぱなしになります。`,
                "この記録が反映されると（次の自動処理のとき）、「保有」の画面にこの銘柄が出ます。そこに出ている損切りの値段を見て、SBIの予約注文をその値段に置き直してください。",
              ],
              "danger",
              { href: "/holdings.html", label: "「保有」の画面を開く" }
            );
          } else {
            showTransientMessage(result.created ? "記録しました" : "この売買は記録済みです", "info");
          }
          await loadAndRender();
        });
      }

      function openSkipModal(proposal) {
        document.getElementById("modal-root").innerHTML = "";
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal-sheet">
            <div class="modal-title">見送る</div>
            <div class="modal-subtitle">${escapeHtml(proposal.symbol)} ・ ${escapeHtml(proposal.bucket)}枠</div>
            <div class="form-row">
              <label>見送る理由（あとで振り返るためのメモです）</label>
              <textarea id="sk-reason" placeholder="例：値動きが怖くて手が出せなかった"></textarea>
            </div>
            <div class="error-text" id="sk-error" hidden></div>
            <div class="modal-actions">
              <button class="btn btn-secondary" id="sk-cancel" type="button">やめる</button>
              <button class="btn btn-primary" id="sk-submit" type="button">見送る</button>
            </div>
          </div>
        `;
        document.getElementById("modal-root").appendChild(overlay);

        const submitBtn = overlay.querySelector("#sk-submit");
        const cancelBtn = overlay.querySelector("#sk-cancel");
        const errorEl = overlay.querySelector("#sk-error");

        cancelBtn.addEventListener("click", closeModal);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) closeModal();
        });

        submitBtn.addEventListener("click", async () => {
          errorEl.hidden = true;
          submitBtn.disabled = true;
          cancelBtn.disabled = true;

          const reason = overlay.querySelector("#sk-reason").value.trim();
          const result = await postSkip(proposal.id, reason);

          if (!result.ok) {
            errorEl.textContent = result.message;
            errorEl.hidden = false;
            submitBtn.disabled = false;
            cancelBtn.disabled = false;
            return;
          }

          closeModal();
          showTransientMessage(
            result.changed ? "見送りとして記録しました" : "この提案はすでに決着していました",
            "info"
          );
          await loadAndRender();
        });
      }

      // ---------------------------------------------------------------
      // 一覧の描画
      // ---------------------------------------------------------------

      // 「反映できていない記録」の帯は3つの画面で共通なので app.js にある。

      // 記録済み（まだ反映されていない）提案の引き当ては app.js に置いた
      // indexUnappliedFills / recordedFillForProposal / failedFillForProposal
      // を使う（3つの画面で同じ決まりにするため）。
      //
      // **決まりは2つ。** どちらも実際に起きた事故に対応している:
      //   1. 引き当ては proposal_id で行う。銘柄＋向きだけで引くと、
      //      同じ銘柄・同じ向きの提案が2件あるときに、片方を記録した
      //      だけで両方が「記録済み」になる。
      //   2. 反映に失敗した記録（apply_error 付き）は「記録済み」に
      //      数えない。数えると、その銘柄のボタンが永久に押せなくなる。

      // 売りの提案カードの、いちばん目立つ枠。
      //
      // **買いの提案の stop_loss は「これからSBIに入れる予約注文の値段」
      // だが、売りの提案の stop_loss は違う。** 保有していたときの値の
      // 転記であって、これから出す注文の指示ではない
      // （migrations/001_initial.sql の proposals の列コメント参照）。
      // 買いと同じ「損切りライン（…SBIで入れます）」を出すと、
      // 「売れ」と言っているカードの一番大きい文字が「予約注文を入れろ」
      // と読めてしまい、売らずに注文だけ置く／売ったうえに注文を残す、
      // のどちらかが起きる。どちらもお金が動く。
      //
      // そこで売りのカードでは、この枠を「いま売る」＋「置いてある
      // 予約注文はもう不要なので取り消す」という、次にやることの案内に
      // 差し替える。見た目は買いの赤枠より控えめ（黄色）にして、
      // **買いの損切りの赤枠がこの画面でいちばん目立つ**状態を保つ。
      function renderSellActionBlock(p) {
        const block = document.createElement("div");
        block.className = "sell-action-block";
        block.innerHTML = `
          <div class="sell-action-label">SBIで売り注文を出してください</div>
          <div class="sell-action-body">
            この銘柄を買ったときにSBIへ置いた予約注文（${yen(
              p.stop_loss
            )}まで値下がりしたら自動で売る注文。SBIでは「逆指値」と呼びます）は、
            <strong>もう不要です。売れたら、SBIでその予約注文を取り消してください。</strong><br>
            取り消さないと、持っていない株を売る注文がSBIに残ったままになります。
          </div>
        `;
        return block;
      }

      // 買いの提案カードの、いちばん目立つ枠。
      // **この赤枠がこの画面の唯一の安全装置。控えめにしないこと。**
      function renderStopLossBlock(p) {
        const block = document.createElement("div");
        block.className = "stop-loss-block";
        block.innerHTML = `
          <div class="stop-loss-label">
            損切りライン（この値段まで下がったら自動で売る予約注文を、SBIで入れます）
          </div>
          <div class="stop-loss-value">${yen(p.stop_loss)}</div>
        `;
        return block;
      }

      // fillIndex: app.js の indexUnappliedFills() が返す索引。
      function renderProposalCard(p, fillIndex) {
        const isBuy = p.action === "buy";
        const isRecorded = recordedFillForProposal(fillIndex, p.id, p.symbol, p.action);
        const applyError = failedFillForProposal(fillIndex, p.id, p.symbol, p.action);
        // 買いの提案で、この銘柄をすでに持っている場合。押すと買い増しに
        // なるので押させない。**売りの提案では持っているのが当たり前**
        // なので、警告を出さない（毎回出す警告は読まれなくなる）。
        const isAlreadyHeld = isBuy && p.already_held === true;
        // 会社名。取れていない銘柄では出さないだけにする（この1件のせいで
        // カード全体を落とさない）。
        const nameText = typeof p.name === "string" && p.name.trim() !== "" ? p.name : null;
        const card = document.createElement("div");
        card.className = "card";

        const head = document.createElement("div");
        head.className = "proposal-card-head";
        head.innerHTML = `
          <div>
            <span class="proposal-side ${isBuy ? "proposal-side-buy" : "proposal-side-sell"}">${
          isBuy ? "買い" : "売り"
        }</span>
            <span class="proposal-symbol">${escapeHtml(p.symbol)}</span>
            <span class="proposal-bucket">${escapeHtml(p.bucket)}枠</span>
            ${nameText ? `<div class="proposal-name">${escapeHtml(nameText)}</div>` : ""}
          </div>
          <div class="days-old ${p.days_old > 0 ? "days-old-warn" : ""}">
            ${p.days_old > 0 ? `${p.days_old}日前の提案` : "今日の提案"}
          </div>
        `;
        card.appendChild(head);

        if (isAlreadyHeld) {
          const held = document.createElement("div");
          held.className = "already-held-block";
          held.innerHTML = `
            <div class="already-held-title">この銘柄は、いま持っています</div>
            <div class="already-held-body">
              <strong>この提案では買わないでください。</strong>
              すでに持っている銘柄をもう一度買うと（買い増しすると）、平均の買値が変わるので、
              SBIに置いてある予約注文（値下がりしたら自動で売る注文）の値段も株数も合わなくなります。
              枠の数え方も狂います。<br>
              この提案は［見送る］を押してください。売るときは「保有」の画面から記録します。
            </div>
          `;
          card.appendChild(held);
        }

        if (isRecorded) {
          const recordedNote = document.createElement("div");
          recordedNote.className = "recorded-badge";
          recordedNote.textContent =
            "記録済み（反映待ち）。この売買はもう届いています。次の自動処理でこのカードは消えます。もう一度記録しないでください。";
          card.appendChild(recordedNote);
        }

        // 反映に失敗した記録がある場合。**この記録は保有にも現金にも
        // 入っていない**ので、ボタンは押せるままにしたうえで、
        // 失敗した理由をそのまま見せる（画面上部の帯にも出ているが、
        // どのカードの話なのかはカードに書かないと分からない）。
        if (applyError) {
          const failed = document.createElement("div");
          failed.className = "fill-error-badge";
          const title = document.createElement("div");
          title.className = "fill-error-title";
          title.textContent = "この記録は反映できませんでした";
          const reason = document.createElement("div");
          reason.textContent = `理由：${applyError}`;
          const next = document.createElement("div");
          next.textContent =
            "この売買は保有にも現金にも入っていません。理由を直したうえで、もう一度記録し直すか、［見送る］を押してください。";
          failed.appendChild(title);
          failed.appendChild(reason);
          failed.appendChild(next);
          card.appendChild(failed);
        }

        card.appendChild(isBuy ? renderStopLossBlock(p) : renderSellActionBlock(p));

        const figures = document.createElement("div");
        figures.className = "proposal-figures";
        if (isBuy) {
          figures.innerHTML = `
            <div class="figure">
              <div class="figure-label">投資額（株数 × 買値）</div>
              <div class="figure-value">${yen(p.cost)}</div>
            </div>
            <div class="figure">
              <div class="figure-label">利確ライン（値上がりしてこの値段になったら売る目安）</div>
              <div class="figure-value figure-value-profit">${yen(p.take_profit)}</div>
            </div>
          `;
        } else {
          // 売りの take_profit も stop_loss と同じで、保有していたときの
          // 値の転記（migrations/001_initial.sql）。「この値段になったら
          // 売る目安」として出すと、いま売れと言っているのに
          // 「その値段まで待て」と読めてしまうので、過去に決めた値だと
          // 分かる書き方にする。
          figures.innerHTML = `
            <div class="figure">
              <div class="figure-label">売る株数</div>
              <div class="figure-value">${p.quantity === null || p.quantity === undefined ? "—" : `${p.quantity}株`}</div>
            </div>
            <div class="figure">
              <div class="figure-label">参考：買ったときに決めていた利確の目安</div>
              <div class="figure-value">${yen(p.take_profit)}</div>
              <div class="figure-hint">いま出す注文の値段ではありません</div>
            </div>
          `;
        }
        card.appendChild(figures);

        const rationale = document.createElement("details");
        rationale.className = "rationale";
        const rationaleText = typeof p.rationale === "string" ? p.rationale : "";
        const summaryText =
          rationaleText.length > 40 ? `${rationaleText.slice(0, 40)}…` : rationaleText || "（理由の記載がありません）";
        rationale.innerHTML = `
          <summary>なぜ${isBuy ? "買う" : "売る"}のか：${escapeHtml(summaryText)}（タップで全文）</summary>
          <p>${escapeHtml(rationaleText)}</p>
        `;
        card.appendChild(rationale);

        const daysNote = document.createElement("p");
        daysNote.className = "hint-text";
        daysNote.textContent = `提案が出たのは ${whenText(p.created_at)}`;
        card.appendChild(daysNote);

        const actions = document.createElement("div");
        actions.className = "proposal-actions";

        const fillBtn = document.createElement("button");
        fillBtn.className = `btn ${isBuy ? "btn-primary" : "btn-sell"}`;
        fillBtn.textContent = isBuy ? "買った" : "売った";
        fillBtn.addEventListener("click", () => openFillModal(p));

        const skipBtn = document.createElement("button");
        skipBtn.className = "btn btn-secondary";
        skipBtn.textContent = "見送る";
        skipBtn.addEventListener("click", () => openSkipModal(p));

        // すでに記録した（まだ反映されていない）提案は、もう一度
        // 記録できないようにする。二重に記録されるとお金の記録が狂う。
        //
        // **［見送る］は止めない。** 記録を間違えた提案を見送りにする道が
        // 無くなると、利用者は反映を待つ以外に手が無くなる。見送りは
        // お金を動かさない操作なので、二重記録の危険も無い。
        if (isRecorded) {
          fillBtn.disabled = true;
          fillBtn.title = "この売買はもう記録されています";
        }

        // 持っている銘柄の買い増しになる提案は押させない。
        // （［見送る］は押せるままにして、この提案を片付けられるようにする。）
        if (isAlreadyHeld) {
          fillBtn.disabled = true;
          fillBtn.title = "この銘柄はいま持っているので、買い増しはできません";
        }

        actions.appendChild(fillBtn);
        actions.appendChild(skipBtn);
        card.appendChild(actions);

        return card;
      }

      function renderBuckets(root, buckets) {
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h2");
        h.textContent = "枠の空き状況";
        card.appendChild(h);
        for (const b of buckets) {
          const row = document.createElement("div");
          row.className = "bucket-row";
          row.innerHTML = `
            <div class="bucket-name">${escapeHtml(b.name)}枠</div>
            <div class="bucket-slots">空き ${b.free}/${b.slots}（使用中 ${b.used}）</div>
          `;
          card.appendChild(row);
        }
        root.appendChild(card);
      }

      function renderCapital(root, state) {
        const card = document.createElement("div");
        card.className = "card";
        const h = document.createElement("h2");
        h.textContent = "現金と総資金";
        card.appendChild(h);

        const cashEntries = Object.entries(state.cash || {});
        for (const [currency, amount] of cashEntries) {
          const row = document.createElement("div");
          row.className = "money-row";
          const label = currency === "JPY" ? "現金" : `現金（${currency}）`;
          const value =
            currency === "JPY"
              ? yen(amount)
              : amount === null || amount === undefined
                ? "—"
                : `${Number(amount).toLocaleString("ja-JP")} ${currency}`;
          row.innerHTML = `<div class="money-label">${label}</div><div class="money-value">${value}</div>`;
          card.appendChild(row);
        }

        const totalRow = document.createElement("div");
        totalRow.className = "money-row";
        totalRow.innerHTML = `<div class="money-label">総資金</div><div class="money-value">${yen(state.capital)}</div>`;
        card.appendChild(totalRow);

        if (state.is_virtual) {
          const note = document.createElement("p");
          note.className = "hint-text";
          note.textContent = "いまは仮の金額で検証している段階です（実際のお金はまだ動いていません）。";
          card.appendChild(note);
        }

        root.appendChild(card);
      }

      async function runAnalyze(button) {
        button.disabled = true;
        const original = button.textContent;
        button.textContent = "分析しています…";
        const result = await postAnalyze();
        button.disabled = false;
        button.textContent = original;
        if (!result.ok) {
          showTransientMessage(result.message, "danger");
          return;
        }
        showTransientMessage("分析を始めました。少し待ってからこの画面を開き直してください。", "info");
      }

      function renderMain(state) {
        const main = document.getElementById("main-root");
        main.innerHTML = "";

        const bannerRoot = document.getElementById("banner-root");
        bannerRoot.innerHTML = "";
        renderUnappliedBanner(bannerRoot, state.unapplied_fills);

        const priceNote = document.createElement("p");
        priceNote.className = "hint-text";
        priceNote.textContent = `更新：${whenText(
          state.generated_at
        )}／株価は15〜20分ほど遅れた情報です。いまの値段そのものではありません。`;
        main.appendChild(priceNote);

        const heading = document.createElement("h2");
        heading.textContent = "未実行の提案";
        main.appendChild(heading);

        const proposals = Array.isArray(state.proposals) ? state.proposals : [];
        if (proposals.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "いま未実行の提案はありません。";
          main.appendChild(empty);
        } else {
          const fillIndex = indexUnappliedFills(state.unapplied_fills);
          for (const p of proposals) {
            try {
              main.appendChild(renderProposalCard(p, fillIndex));
            } catch (err) {
              console.error("提案カードの表示に失敗しました", err);
              const bad = document.createElement("div");
              bad.className = "card";
              bad.textContent = "この提案は表示できませんでした（データの形が想定と違います）。";
              main.appendChild(bad);
            }
          }
        }

        try {
          renderBuckets(main, Array.isArray(state.buckets) ? state.buckets : []);
        } catch (err) {
          console.error("枠の空き状況の表示に失敗しました", err);
        }

        try {
          renderCapital(main, state);
        } catch (err) {
          console.error("現金・総資金の表示に失敗しました", err);
        }

        try {
          renderNotifyCard(main, state.vapid_public_key);
        } catch (err) {
          console.error("通知カードの表示に失敗しました", err);
        }

        const analyzeCard = document.createElement("div");
        analyzeCard.className = "card";
        const analyzeBtn = document.createElement("button");
        analyzeBtn.className = "btn btn-primary btn-block";
        analyzeBtn.textContent = "いま分析して";
        analyzeBtn.addEventListener("click", () => runAnalyze(analyzeBtn));
        analyzeCard.appendChild(analyzeBtn);
        const analyzeNote = document.createElement("p");
        analyzeNote.className = "hint-text";
        analyzeNote.textContent = "押すと、いまの株価をもとに提案を作り直します。少し時間がかかることがあります。";
        analyzeCard.appendChild(analyzeNote);
        main.appendChild(analyzeCard);
      }

      async function loadAndRender() {
        const main = document.getElementById("main-root");
        main.innerHTML = '<div class="loading-state">読み込んでいます…</div>';
        try {
          const state = await loadState();
          renderMain(state);
        } catch (err) {
          // 読み込みに失敗したときも banner-root を空にする。
          // 消さないと、前回の「反映できていない記録が◯件あります」が
          // 残ったままになり、いま読めていない状態の情報として
          // 読まれてしまう（古い件数を今の件数と勘違いする）。
          document.getElementById("banner-root").innerHTML = "";
          main.innerHTML = "";
          main.appendChild(banner("danger", err.message || "いまの状態を読み込めませんでした"));
          const retryBtn = document.createElement("button");
          retryBtn.className = "btn btn-secondary btn-block";
          retryBtn.textContent = "もう一度読み込む";
          retryBtn.addEventListener("click", () => loadAndRender());
          main.appendChild(retryBtn);
        }
      }

      document.getElementById("nav-root").appendChild(renderNav("today"));
      renderInstallBanner();
      registerServiceWorker();
      loadAndRender();
    </script>
  </body>
</html>
