<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>保有</title>
    <link rel="stylesheet" href="/app.css" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="投資" />
  </head>
  <body>
    <noscript>
      この画面を使うにはJavaScriptが必要です。iPhoneの「設定」からJavaScriptを有効にしてください。
    </noscript>

    <div class="app-container">
      <div id="nav-root"></div>
      <h1>保有</h1>
      <div id="banner-root"></div>
      <main id="main-root">
        <div class="loading-state">読み込んでいます…</div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>

    <script type="module">
      import {
        loadState,
        postFill,
        yen,
        pct,
        whenText,
        toDatetimeLocalValue,
        jstLocalToIso,
        escapeHtml,
        banner,
        renderNav,
        renderUnappliedBanner,
        signedYen,
        distancePct,
        clientKeyFor,
        forgetClientKey,
        isJapaneseStock,
        indexUnappliedFills,
        recordedFillForSymbol,
        failedFillForSymbol,
      } from "/app.js";

      // 回転枠の期限（rules/v3.md）。/api/state の positions には
      // max_holding_days が枠ごとに入っているので、その値をそのまま使う
      // （ここに数字を書き写さない）。

      // ---------------------------------------------------------------
      // 一時的なお知らせ（記録しました、など）
      // ---------------------------------------------------------------
      function showTransientMessage(text, kind) {
        const root = document.getElementById("toast-root");
        const el = banner(kind || "info", text);
        el.style.position = "fixed";
        el.style.left = "16px";
        el.style.right = "16px";
        el.style.bottom = "calc(16px + env(safe-area-inset-bottom))";
        el.style.zIndex = "100";
        root.appendChild(el);
        setTimeout(() => {
          el.remove();
        }, 4500);
      }

      // ---------------------------------------------------------------
      // 「売った」の入力欄
      // ---------------------------------------------------------------
      function closeModal() {
        document.getElementById("modal-root").innerHTML = "";
      }

      // position: state.positions の1件。
      function openSellModal(position) {
        document.getElementById("modal-root").innerHTML = "";
        const now = new Date();
        // 二重送信よけの鍵。**この銘柄の売りに対する鍵は sessionStorage に
        // 退避してあり、モーダルを閉じて開き直しても同じ鍵になる**
        // （app.js の clientKeyFor を参照）。「失敗 → [やめる] →
        // もう一度 [売った]」で新しい鍵になると、サーバーには届いたが
        // 応答が返らなかった場合に同じ売りが2行記録される。
        // 記録できたら forgetClientKey で捨てる。
        const keyScope = `position:${position.symbol}:sell`;
        let clientKey = clientKeyFor(keyScope);

        // 100株単位は日本株（銘柄コードが .T で終わるもの）だけの決まり。
        // サーバー側の functions/_shared/validate.js:53 も日本株にだけ
        // この確認をしている。米国株にまで「100株単位」と案内すると嘘になる。
        const isJp = isJapaneseStock(position.symbol);
        const unit = isJp ? 100 : 1;
        const unitHint = isJp
          ? "100株単位で入れてください（日本株は100株ずつしか売買できません）。"
          : "1株から売れます（この銘柄は日本株ではないので、100株単位の決まりはありません）。";

        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal-sheet">
            <div class="modal-title">売った を記録する</div>
            <div class="modal-subtitle">${escapeHtml(position.symbol)} ・ ${escapeHtml(position.bucket)}枠</div>

            <div class="form-row">
              <label>銘柄コード</label>
              <div class="form-row-static">${escapeHtml(position.symbol)}</div>
              ${
                // 会社名。取れていない銘柄では出さないだけにする。
                typeof position.name === "string" && position.name.trim() !== ""
                  ? `<p class="hint-text">${escapeHtml(position.name)}</p>`
                  : ""
              }
            </div>
            <div class="form-row">
              <label>株数（保有 ${position.quantity ?? "—"}株）</label>
              <input type="number" inputmode="numeric" id="fm-quantity" min="${unit}" step="${unit}"
                value="${position.quantity ?? ""}">
              <p class="hint-text">${unitHint}</p>
            </div>
            <div class="warn-box" id="fm-partial-warn" hidden>
              一部だけ売ると、SBIに置いた予約注文の株数が実際の保有と合わなくなります。<br>
              売ったあとに予約注文を置き直してください。
            </div>
            <div class="form-row">
              <label>売った値段（1株あたり）</label>
              <input type="number" inputmode="decimal" id="fm-price" min="0" step="0.01"
                value="${position.last_price != null ? position.last_price : ""}">
              <p class="hint-text">SBIで実際に約定した値段をそのまま入れてください（現在値とずれていて構いません）。</p>
              <p class="hint-text">参考：損切りの目安 ${yen(position.stop_loss)} ／ 利確の目安 ${yen(position.take_profit)}</p>
            </div>
            <div class="form-row">
              <label>売買した日時（日本時間）</label>
              <input type="datetime-local" id="fm-traded-at" value="${toDatetimeLocalValue(now)}">
            </div>
            <div class="form-row">
              <label>手数料（円）</label>
              <input type="number" inputmode="numeric" id="fm-fee" min="0" step="1" value="0">
            </div>

            <div class="error-text" id="fm-error" hidden></div>

            <div class="modal-actions">
              <button class="btn btn-secondary" id="fm-cancel" type="button">やめる</button>
              <button class="btn btn-sell" id="fm-submit" type="button">この内容で記録する</button>
            </div>
          </div>
        `;
        document.getElementById("modal-root").appendChild(overlay);

        const submitBtn = overlay.querySelector("#fm-submit");
        const cancelBtn = overlay.querySelector("#fm-cancel");
        const errorEl = overlay.querySelector("#fm-error");
        const quantityInput = overlay.querySelector("#fm-quantity");
        const partialWarn = overlay.querySelector("#fm-partial-warn");

        const fullQuantity = Number(position.quantity);
        const updatePartialWarn = () => {
          const q = Number(quantityInput.value);
          partialWarn.hidden = !(Number.isFinite(q) && q > 0 && Number.isFinite(fullQuantity) && q < fullQuantity);
        };
        quantityInput.addEventListener("input", updatePartialWarn);
        updatePartialWarn();

        cancelBtn.addEventListener("click", closeModal);
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay) closeModal();
        });

        submitBtn.addEventListener("click", async () => {
          errorEl.hidden = true;
          submitBtn.disabled = true;
          cancelBtn.disabled = true;

          const quantity = Number(quantityInput.value);
          const price = Number(overlay.querySelector("#fm-price").value);
          const feeRaw = overlay.querySelector("#fm-fee").value;
          const fee = feeRaw === "" ? 0 : Number(feeRaw);
          // 入力欄は日本時間で見せている（app.js の toDatetimeLocalValue）
          // ので、読み戻しも日本時間として読む。new Date(raw) は端末の
          // ローカル時刻として解釈してしまうので使わない。
          const tradedAtIso = jstLocalToIso(overlay.querySelector("#fm-traded-at").value);

          const result = await postFill({
            client_key: clientKey || undefined,
            symbol: position.symbol,
            side: "sell",
            quantity,
            price,
            fee,
            traded_at: tradedAtIso,
          });
          // 失敗しても、次の送信で同じ鍵を使えるように覚えておく。
          clientKey = result.client_key;

          if (!result.ok) {
            errorEl.textContent = result.message;
            errorEl.hidden = false;
            submitBtn.disabled = false;
            cancelBtn.disabled = false;
            return;
          }

          // 記録できたので、この売りの鍵は捨てる（次に同じ銘柄を
          // 売るときに使い回さないため）。
          forgetClientKey(keyScope);

          closeModal();
          showTransientMessage(result.created ? "記録しました" : "この売買は記録済みです", "info");
          await loadAndRender();
        });
      }

      // ---------------------------------------------------------------
      // 一覧の描画
      // ---------------------------------------------------------------

      // 1件の保有カードを組み立てる。ここで例外が出ても、呼び出し側
      // （renderMain）が1件ずつ try/catch しているので、他の保有の表示は
      // 巻き添えにならない。
      // まだ反映されていない「売った」の記録があるかどうかは、app.js の
      // indexUnappliedFills / recordedFillForSymbol で引く（3つの画面で
      // 同じ決まりにするため）。反映されるまで保有はそのまま残るので、
      // これが無いと同じ売りをもう一度記録できてしまう（記録が2行入り、
      // 保有と現金が狂う）。
      //
      // **反映に失敗した記録（apply_error 付き）は「記録済み」に数えない。**
      // 失敗した記録は同じ理由で毎回失敗し続けるので、数えると
      // ［売った］が永久に押せなくなる。fills を消す手段は画面にも API にも
      // 無いので、そうなると利用者はそこから先へ進めない。

      // fillIndex: app.js の indexUnappliedFills() が返す索引。
      function renderPositionCard(position, fillIndex) {
        const hasPendingSell = recordedFillForSymbol(fillIndex, position.symbol, "sell");
        const sellApplyError = failedFillForSymbol(fillIndex, position.symbol, "sell");
        const hasLastPrice = position.last_price !== null && position.last_price !== undefined;
        const isRotation = position.max_holding_days !== null && position.max_holding_days !== undefined;
        // 経過営業日・期限までの残り営業日は /api/state がすでに計算して
        // 返す（functions/_shared/state.js）。ここでは受け取った値を
        // そのまま使うだけで、日数を数え直さない。
        const elapsedDays = position.business_days_held ?? null;
        const daysLeft = position.days_left ?? null;
        // ちょうど期限（10営業日）たった日を含めて期限切れ扱いにする
        // （functions/_shared/state.js・morning_check.py と同じ境目。
        // days_left が 0 以下なら期限切れ）。
        const isOverdue = isRotation && daysLeft !== null && daysLeft <= 0;

        const card = document.createElement("div");
        card.className = "card" + (isOverdue ? " card-danger" : "");

        if (hasPendingSell) {
          const recordedNote = document.createElement("div");
          recordedNote.className = "recorded-badge";
          recordedNote.textContent =
            "「売った」を記録済み（反映待ち）。反映されるまで、この銘柄はここに残ります。同じ売りをもう一度記録しないでください。";
          card.appendChild(recordedNote);
        }

        // 反映に失敗した「売った」の記録がある場合。**この売りは保有にも
        // 現金にも入っていない**ので、［売った］は押せるままにしたうえで、
        // 失敗した理由をそのまま見せる。
        if (sellApplyError) {
          const failed = document.createElement("div");
          failed.className = "fill-error-badge";
          const title = document.createElement("div");
          title.className = "fill-error-title";
          title.textContent = "この記録は反映できませんでした";
          const reason = document.createElement("div");
          reason.textContent = `理由：${sellApplyError}`;
          const next = document.createElement("div");
          next.textContent =
            "この売りは保有にも現金にも入っていません。理由を直したうえで、もう一度記録し直してください。";
          failed.appendChild(title);
          failed.appendChild(reason);
          failed.appendChild(next);
          card.appendChild(failed);
        }

        if (isOverdue) {
          const expiry = document.createElement("div");
          expiry.className = "expiry-block";
          expiry.innerHTML = `
            <div class="expiry-title">期限切れ　${elapsedDays}営業日経過 / 期限${position.max_holding_days}営業日</div>
            <div class="expiry-note">値動きに関係なく、降りて枠を空けてください</div>
          `;
          card.appendChild(expiry);
        }

        const head = document.createElement("div");
        head.className = "proposal-card-head";
        // 会社名。SBIの画面で銘柄コードを打ち込むときの照合用。
        // **取れていない銘柄（name が null）では出さないだけにする。**
        // ここで落とすと、会社名が引けなかった1件のために保有そのものが
        // 見えなくなる（補助の失敗が本体を巻き添えにしてはいけない）。
        const nameText =
          typeof position.name === "string" && position.name.trim() !== "" ? position.name : null;
        head.innerHTML = `
          <div>
            <span class="proposal-symbol">${escapeHtml(position.symbol)}</span>
            <span class="proposal-bucket">${escapeHtml(position.bucket)}枠</span>
            ${nameText ? `<div class="proposal-name">${escapeHtml(nameText)}</div>` : ""}
          </div>
        `;
        card.appendChild(head);

        const summary = document.createElement("p");
        summary.textContent = `${position.quantity ?? "—"}株 ・ 平均 ${yen(position.avg_price)}`;
        card.appendChild(summary);

        // 現在値・含み損益
        const priceFigures = document.createElement("div");
        priceFigures.className = "proposal-figures";
        if (hasLastPrice) {
          const pnl = position.unrealized_pnl;
          const pnlPct = position.unrealized_pct;
          const pnlLabel = pnl > 0 ? "含み益" : pnl < 0 ? "含み損" : "含み損益";
          const pnlClass = pnl > 0 ? "figure-value-profit" : pnl < 0 ? "figure-value-loss" : "";
          priceFigures.innerHTML = `
            <div class="figure">
              <div class="figure-label">現在値</div>
              <div class="figure-value">${yen(position.last_price)}</div>
              <div class="figure-hint">${whenText(position.last_price_at)} 時点</div>
            </div>
            <div class="figure">
              <div class="figure-label">${pnlLabel}</div>
              <div class="figure-value ${pnlClass}">${signedYen(pnl)} (${pct(pnlPct)})</div>
            </div>
          `;
        } else {
          priceFigures.innerHTML = `
            <div class="figure">
              <div class="figure-label">現在値</div>
              <div class="figure-value">—</div>
              <div class="figure-hint">まだ取得していません</div>
            </div>
            <div class="figure">
              <div class="figure-label">含み益</div>
              <div class="figure-value">—</div>
            </div>
          `;
        }
        card.appendChild(priceFigures);

        // 損切り・利確ラインまでの距離
        const stopFigures = document.createElement("div");
        stopFigures.className = "proposal-figures";
        const stopDistance = hasLastPrice ? distancePct(position.last_price, position.stop_loss) : null;
        const takeDistance = hasLastPrice ? distancePct(position.last_price, position.take_profit) : null;
        stopFigures.innerHTML = `
          <div class="figure">
            <div class="figure-label">損切り</div>
            <div class="figure-value figure-value-loss">${yen(position.stop_loss)}</div>
            <div class="figure-hint">${hasLastPrice ? `← あと ${pct(stopDistance)}` : "現在値が無いため出せません"}</div>
          </div>
          <div class="figure">
            <div class="figure-label">利確</div>
            <div class="figure-value figure-value-profit">${yen(position.take_profit)}</div>
            <div class="figure-hint">${hasLastPrice ? `← あと ${pct(takeDistance)}` : "現在値が無いため出せません"}</div>
          </div>
        `;
        card.appendChild(stopFigures);

        // **この仕組みの唯一の安全装置は、SBIに置いてある予約注文だけ。**
        // ここに出ている損切りの値段は、実際に買った値段から計算し直された
        // 値（src/investment/fills.py の _exits）で、提案のカードに出ていた
        // 値段とは限らない。提案と違う値段で約定すると両者はずれるが、
        // SBIの注文は誰も置き直さない。**そのずれに気づけるのはこの画面
        // だけ**なので、条件を付けずに常に出す。
        const stopCheck = document.createElement("div");
        stopCheck.className = "stop-check-note";
        stopCheck.innerHTML = `
          SBIに置いてある予約注文（この値段まで下がったら自動で売る注文。SBIでは「逆指値」と呼びます）が、
          <strong>上の「損切り」の値段になっているか確かめてください。</strong><br>
          提案と違う値段で買ったときは、ここの損切りの値段が提案のカードと変わります。
          SBIの注文を置き直さないと、値下がりしたときの損が、ルールで決めた幅と違ってしまいます。
        `;
        card.appendChild(stopCheck);

        // 回転枠の期限（まだ期限切れではない場合の、控えめな表示）
        //
        // 「回転枠」は、値動きに関係なく決まった日数で結論を出す枠
        // （もう1つの「じっくり枠」には期限が無い）。ここでの「日」は
        // 平日（営業日）だけを数える。
        if (isRotation && !isOverdue) {
          const note = document.createElement("p");
          note.className = "hint-text";
          note.textContent =
            elapsedDays === null || daysLeft === null
              ? "回転枠：期限までの日数が出せませんでした"
              : `回転枠：あと${daysLeft}営業日で期限（${elapsedDays}営業日経過 / 期限${position.max_holding_days}営業日）`;
          card.appendChild(note);
        }

        const actions = document.createElement("div");
        actions.className = "proposal-actions";
        const sellBtn = document.createElement("button");
        sellBtn.className = "btn btn-sell";
        sellBtn.textContent = "売った";
        sellBtn.addEventListener("click", () => openSellModal(position));
        // 反映待ちの売りがある間は押せなくする（二重記録を防ぐ）。
        // 一部だけ売った残りを記録したいときは、反映が済んでから。
        if (hasPendingSell) sellBtn.disabled = true;
        actions.appendChild(sellBtn);
        card.appendChild(actions);

        return card;
      }

      function renderMain(state) {
        const main = document.getElementById("main-root");
        main.innerHTML = "";

        // 反映待ちの記録の帯。**この画面でいちばん必要**：
        // [売った] を記録しても反映は次の自動処理までかかるので、
        // 読み込み直しても銘柄は残り [売った] も押せる。この帯が無いと
        // 記録できたのかどうか画面から分からない。
        const bannerRoot = document.getElementById("banner-root");
        bannerRoot.innerHTML = "";
        renderUnappliedBanner(bannerRoot, state.unapplied_fills);

        const priceNote = document.createElement("p");
        priceNote.className = "hint-text";
        priceNote.textContent =
          "現在値は、朝の確認のときに保存された値です。銘柄ごとに「時点」が違うことがあります。いまの値段そのものではありません。";
        main.appendChild(priceNote);

        const positions = Array.isArray(state.positions) ? state.positions : [];
        if (positions.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "いま保有している銘柄はありません。";
          main.appendChild(empty);
        } else {
          const fillIndex = indexUnappliedFills(state.unapplied_fills);
          for (const position of positions) {
            try {
              main.appendChild(renderPositionCard(position, fillIndex));
            } catch (err) {
              console.error("保有カードの表示に失敗しました", err);
              const bad = document.createElement("div");
              bad.className = "card";
              bad.textContent = "この保有は表示できませんでした（データの形が想定と違います）。";
              main.appendChild(bad);
            }
          }
        }
      }

      async function loadAndRender() {
        const main = document.getElementById("main-root");
        main.innerHTML = '<div class="loading-state">読み込んでいます…</div>';
        try {
          const state = await loadState();
          renderMain(state);
        } catch (err) {
          // 失敗の経路でも banner-root を空にする（前回の「反映できて
          // いない記録が◯件」を、いまの件数として読ませないため）。
          document.getElementById("banner-root").innerHTML = "";
          main.innerHTML = "";
          main.appendChild(banner("danger", err.message || "いまの状態を読み込めませんでした"));
          const retryBtn = document.createElement("button");
          retryBtn.className = "btn btn-secondary btn-block";
          retryBtn.textContent = "もう一度読み込む";
          retryBtn.addEventListener("click", () => loadAndRender());
          main.appendChild(retryBtn);
        }
      }

      document.getElementById("nav-root").appendChild(renderNav("holdings"));
      loadAndRender();
    </script>
  </body>
</html>
