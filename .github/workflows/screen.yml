name: screen

on:
  schedule:
    - cron: "0 21 * * 0"   # 毎週日曜 21:00 UTC = 月曜 6:00 JST
  workflow_dispatch:

concurrency:
  group: screen
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync

      - name: データベースの構造を最新にする
        # 列を足したなどの変更を、データを読み書きする前に必ず適用する。
        # これが無いと、変更した日に本番だけが古い構造のまま動き、
        # 「そんな列は無い」で止まる（2026-09-07 に発生）。
        run: uv run python -m investment.jobs.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src

      - run: uv run python -m investment.jobs.run_screen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # このプロジェクトはパッケージとしてインストールされていないため、
          # `python -m investment...` が import できるよう src を明示的に追加する。
          # （手元で `uv run python -m investment.jobs.run_screen` を試したところ
          #   ModuleNotFoundError になったため、実際に動くことを確認して追加した）
          PYTHONPATH: src
