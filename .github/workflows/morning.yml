name: morning

on:
  schedule:
    - cron: "0 22 * * 0-4"   # 22:00 UTC = 翌 7:00 JST（月〜金の朝）
  workflow_dispatch:

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync

      - name: データベースの構造を最新にする
        # 列を足したなどの変更を、データを読み書きする前に必ず適用する。
        # これが無いと、変更した日に本番だけが古い構造のまま動き、
        # 「そんな列は無い」で止まる（2026-09-07 に発生）。
        run: uv run python -m investment.jobs.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src

      - name: 記録された売買を反映する
        # スマホから「買った/売った」と記録された内容を、保有・現金・履歴に
        # 反映する。朝の確認より先に行う。反映しないまま確認すると、
        # 買ったばかりの銘柄を見落とす。
        run: uv run python -m investment.jobs.apply_fills
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src

      - run: uv run python -m investment.jobs.morning_check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # このプロジェクトはパッケージとしてインストールされていないため、
          # `python -m investment...` が import できるよう src を明示的に追加する。
          # （screen.yml / analyze.yml と同じ理由。無いと ModuleNotFoundError で必ず失敗する）
          PYTHONPATH: src
