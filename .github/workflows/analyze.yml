name: analyze

on:
  workflow_dispatch:

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 候補22件を1銘柄ずつWebSearchで調べると、AIのステップだけで約18分かかる。
    # 候補が増えれば伸びるため、余裕を持たせてある。
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: データベースの構造を最新にする
        # 列を足したなどの変更を、データを読み書きする前に必ず適用する。
        # これが無いと、変更した日に本番だけが古い構造のまま動き、
        # 「そんな列は無い」で止まる（2026-09-07 に発生）。
        run: uv run python -m investment.jobs.migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src


      - name: コンテキストを作る
        run: uv run python -m investment.jobs.build_context
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # このプロジェクトはパッケージとしてインストールされていないため、
          # `python -m investment...` が import できるよう src を明示的に追加する
          # （screen.yml と同じ理由。無いと ModuleNotFoundError で必ず失敗する）
          PYTHONPATH: src

      - name: Claude が判断する
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/analyze"
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools "Read,Glob,Write,WebSearch,WebFetch"
        # --max-turns について:
        #   候補1件あたり数ターン(検索→記事を読む→数字を確認)かかるため、
        #   必要なターン数は候補数に比例する。候補22件のときは74ターン使った。
        #   30では足りず、判断も日誌も完成していたのにステップが失敗扱いになり、
        #   次の保存ステップが飛ばされて判断が捨てられた(2026-09-07)。
        #   実質的な歯止めは上の timeout-minutes なので、ここは余裕を持たせる。
        #
        # Glob を許可している理由:
        #   手順3で journal/ の直近5営業日のファイルを読ませているが、
        #   どのファイルがあるかを調べる手段が無いと読めない。
        #   Bash は許可しない(何でもできてしまうため)。

      - name: 判断を検証して保存する
        # 前のステップ(Claude が判断する)が失敗しても、このステップは実行する。
        # 2026-09-07 に、AIは判断も日誌も完成させたのに「使ったターン数が上限を
        # 超えた」という理由だけでステップが失敗扱いになり、完成していた判断が
        # 保存されずに捨てられた。判断ファイルが本当に無い場合は、
        # apply_decision が data_gaps に記録して終了する(例外は投げない)。
        if: always()
        run: uv run python -m investment.jobs.apply_decision
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src

      # AIが書いたものを、git とは別の場所にも残す。
      # journal はランナーの上にしか存在しない時間があり、そこで
      # push が失敗すると調査結果がまるごと消える（2026-09-07 に3回発生）。
      # 成果物として上げておけば、push がどう転んでも実行画面から取り出せる。
      - name: AIが書いたものを成果物として残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            journal/
            build/decision.json
            build/context.json
          if-no-files-found: warn
          retention-days: 90

      - name: journal をコミットする
        # 前のステップ(判断を検証して保存する)が失敗しても、このステップは実行する。
        # AIの調査・判断・振り返りは journal に既に書かれている。
        # 検証ステップの失敗(例: 想定外の型が混ざっていた)を理由に journal の
        # コミットまで飛ばしてしまうと、AIの調査結果そのものが失われてしまう。
        if: always()
        run: |
          set -euo pipefail
          git config user.name "investment-bot"
          git config user.email "noreply@example.com"
          git add journal/
          if git diff --staged --quiet; then
            echo "journal に変更がないため、コミットしません"
            exit 0
          fi
          git commit -m "chore: $(date +%F) の判断を記録"

          # この実行の間に main が進んでいると push は必ず弾かれる。
          # 弾かれたまま終わると、AIが書いた日誌はランナーごと消える
          # （2026-09-07 に実際に失われた: 311行の調査記録がまるごと消滅）。
          # リモートの変更を取り込み直してから押し直す。
          # journal/ は日付ごとの別ファイルで、この処理以外は誰も触らないため、
          # rebase で内容がぶつかることは実質起こらない。
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "journal を push しました（試行 ${attempt} 回目）"
              exit 0
            fi
            echo "push が弾かれました。取り込み直して再試行します（${attempt}/3）"
            sleep 5
          done
          echo "3回試しても push できませんでした" >&2
          exit 1
