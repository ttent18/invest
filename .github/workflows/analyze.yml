name: analyze

on:
  workflow_dispatch:

concurrency:
  group: analyze
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - run: uv sync

      - name: コンテキストを作る
        run: uv run python -m investment.jobs.build_context
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # このプロジェクトはパッケージとしてインストールされていないため、
          # `python -m investment...` が import できるよう src を明示的に追加する
          # （screen.yml と同じ理由。無いと ModuleNotFoundError で必ず失敗する）
          PYTHONPATH: src

      - name: Claude が判断する
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/analyze"
          claude_args: |
            --model claude-opus-5
            --max-turns 30
            --allowedTools "Read,Write,WebSearch,WebFetch"

      - name: 判断を検証して保存する
        run: uv run python -m investment.jobs.apply_decision
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src

      - name: journal をコミットする
        run: |
          git config user.name "investment-bot"
          git config user.email "noreply@example.com"
          git add journal/
          git diff --staged --quiet || git commit -m "chore: $(date +%F) の判断を記録"
          git push
