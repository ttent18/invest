[project]
name = "investment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "yfinance>=0.2.50",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
markers = [
    "integration: 実際のDBやネットワークを使うテスト",
]

[tool.ruff]
line-length = 100
